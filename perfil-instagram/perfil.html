<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Perfil Instagram</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&family=Nunito+Sans:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1080px; background: #fff; overflow: hidden; }
  .circulo {
    width: 1020px; height: 1020px; margin: 30px; border-radius: 50%;
    border: 58px solid #5BA80A; background: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: 'Nunito Sans', sans-serif; color: #3A3A3A;
  }
  .circulo img { width: 580px; margin-top: 10px; }
  .galaro { font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 50px; letter-spacing: 3px; margin-top: 22px; }
  .lugar { font-weight: 700; font-size: 34px; color: #6a6a6a; margin-top: 4px; letter-spacing: 1px; }
</style></head>
<body>
  <div class="circulo">
    <img src="../logo-te-quiero-verde-sin-fondo.png" alt="Te Quiero Verde">
    <div class="galaro">GALARO S.A.</div>
    <div class="lugar">Bell Ville · Cba.</div>
  </div>
</body></html>
