<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Buen finde</title><link rel="stylesheet" href="carrusel.css">

  <div class="centro" style="top:380px">
    <div class="pre" style="font-size:60px">Tengan un buen</div>
    <div class="gigante" style="font-size:240px;margin:8px 0 0 0;letter-spacing:-6px">Finde<span>.</span></div>
  </div>
  <div class="centro" style="bottom:290px">
    <img src="logo-blanco.png" alt="Te Quiero Verde" style="width:220px;filter:drop-shadow(0 4px 14px rgba(0,0,0,.45))">
    <div style="margin-top:28px"><span class="banda">Les desea el equipo de <b>Te Quiero Verde</b></span></div>
  </div>
